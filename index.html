<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Copying…</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #137333; color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    body.fail {
      background: #fff; color: #202124;
      flex-direction: column; padding: 24px;
      align-items: flex-start; justify-content: flex-start;
    }
    .msg { font-size: 28px; font-weight: 600; }
    .fail .msg { font-size: 14px; color: #5f6368; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 600; }
    .value {
      font-size: 18px; padding: 18px; background: #f1f3f4; border-radius: 10px;
      word-break: break-word; white-space: pre-wrap; user-select: all;
      line-height: 1.5; max-width: 640px; width: 100%; box-sizing: border-box;
      display: none;
    }
    .hint { color: #5f6368; margin-top: 12px; font-size: 13px; display: none; }
    .fail .value, .fail .hint { display: block; }
  </style>
</head>
<body>
  <div class="msg" id="msg">✓ Copied</div>
  <div class="value" id="value"></div>
  <div class="hint" id="hint">Press Cmd+C (Mac) or Ctrl+C (Windows) to copy this value, then close the tab.</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var VALUE = params.get('value') || '';
      var LABEL = params.get('label') || 'Field';
      var done = false;

      async function tryCopy() {
        if (done) return true;
        // Modern Clipboard API
        try {
          await navigator.clipboard.writeText(VALUE);
          return true;
        } catch (e) { /* fall through */ }
        // Legacy execCommand
        try {
          var ta = document.createElement('textarea');
          ta.value = VALUE;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) return true;
        } catch (e) { /* fall through */ }
        return false;
      }

      function finishSuccess() {
        if (done) return;
        done = true;
        window.close();
      }

      function showFallback() {
        if (done) return;
        done = true;
        document.body.classList.add('fail');
        document.getElementById('msg').textContent = LABEL;
        document.title = 'Copy — Tree Boss';
        var v = document.getElementById('value');
        v.textContent = VALUE;
        var range = document.createRange();
        range.selectNodeContents(v);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }

      async function attempt() {
        if (done) return;
        if (await tryCopy()) {
          finishSuccess();
        }
      }

      // Strategy: try immediately, then again on every focus / visibility change
      // for up to 2.5 seconds. Tabs opened in background (cmd-click, middle-click,
      // browser settings) start without focus, and both clipboard APIs require
      // document.hasFocus() === true. Retrying on focus events catches the moment
      // the user switches to (or the browser grants focus to) this tab.
      attempt();
      window.addEventListener('focus', attempt);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) attempt();
      });
      // Also retry a few times in the first second just in case focus arrived
      // silently between events.
      setTimeout(attempt, 100);
      setTimeout(attempt, 300);
      setTimeout(attempt, 700);
      setTimeout(attempt, 1500);
      // Final timeout — show the manual UI if we still haven't copied.
      setTimeout(function () { if (!done) showFallback(); }, 2500);
    })();
  </script>
</body>
</html>

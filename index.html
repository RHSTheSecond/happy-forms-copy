<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Copy — Tree Boss</title>
  <style>
    :root { --vtc:#600C54; --vtc2:#781878; --green:#137333; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #faf7fb; color: #202124;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 28px 20px;
    }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #5f6368; }
    #btn {
      font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--vtc);
      border: none; border-radius: 12px; padding: 16px 30px; cursor: pointer; min-width: 240px;
      box-shadow: 0 2px 6px rgba(96,12,84,.25); transition: background .15s, transform .05s;
    }
    #btn:hover { background: var(--vtc2); }
    #btn:active { transform: translateY(1px); }
    #btn.ok { background: var(--green); box-shadow: none; }
    .value {
      font-size: 20px; line-height: 1.5; padding: 16px 18px; background: #f1f3f4; border-radius: 12px;
      max-width: 680px; width: 100%; word-break: break-word; white-space: pre-wrap;
      user-select: all; -webkit-user-select: all; cursor: text;
    }
    .hint { font-size: 13px; color: #5f6368; text-align: center; max-width: 680px; }
  </style>
</head>
<body>
  <div class="label" id="label">Field</div>
  <button id="btn" type="button">📋 Copy</button>
  <div class="value" id="value"></div>
  <div class="hint" id="hint">Tap <b>Copy</b> above — or select the text and press Ctrl/Cmd + C.</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var VALUE = params.get('value') || '';
      var LABEL = params.get('label') || 'Field';
      var elLabel = document.getElementById('label');
      var elBtn = document.getElementById('btn');
      var elValue = document.getElementById('value');
      var elHint = document.getElementById('hint');

      elLabel.textContent = LABEL;
      elValue.textContent = VALUE;
      elBtn.textContent = '📋 Copy ' + LABEL;
      document.title = 'Copy ' + LABEL + ' — Tree Boss';

      function selectValue() {
        try {
          var r = document.createRange();
          r.selectNodeContents(elValue);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        } catch (e) { /* ignore */ }
      }

      async function doCopy() {
        // Clipboard API (needs a user gesture / focus — reliable from the button click).
        try { await navigator.clipboard.writeText(VALUE); return true; } catch (e) { /* fall through */ }
        // Legacy execCommand fallback.
        try {
          var ta = document.createElement('textarea');
          ta.value = VALUE; ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) return true;
        } catch (e) { /* fall through */ }
        return false;
      }

      function markCopied() {
        elBtn.textContent = '✓ Copied ' + LABEL;
        elBtn.classList.add('ok');
        elHint.textContent = 'Copied to your clipboard.';
        // Restore the old auto-close after a successful copy (from the button click OR the
        // on-load auto-copy). Works where the browser lets the opened tab self-close — which is
        // what happened before the rewrite; harmless (message stays) if the browser blocks it.
        setTimeout(function () { try { window.close(); } catch (e) {} }, 200);
      }

      // The button is the RELIABLE path — a real click is a user gesture the clipboard needs.
      elBtn.addEventListener('click', async function () {
        if (await doCopy()) markCopied(); else selectValue();
      });

      // Best-effort auto-copy on load (works on clients that grant focus/activation to the
      // opened tab). If it fails, the value is pre-selected and the Copy button is right there.
      (async function () {
        if (await doCopy()) markCopied(); else selectValue();
      })();
    })();
  </script>
</body>
</html>

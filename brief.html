<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Copying…</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #137333; color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    /* Manual-copy UI is shown ONLY when every auto-copy attempt failed. */
    body.fail {
      background: #f6f7f9; color: #202124;
      flex-direction: column; padding: 24px;
      align-items: flex-start; justify-content: flex-start;
    }
    .msg { font-size: 28px; font-weight: 600; }
    .fail .msg { font-size: 18px; color: #600C54; margin: 0 0 2px; }
    .sub { display: none; }
    .fail .sub { display: block; color: #5f6368; font-size: 13px; margin-bottom: 14px; }
    textarea {
      display: none;
      width: 100%; box-sizing: border-box; min-height: 60vh; resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
      padding: 14px; border: 1px solid #dadce0; border-radius: 10px; background: #fff; color: #202124;
      white-space: pre; tab-size: 2;
    }
    .fail textarea { display: block; }
    .hint { display: none; }
    .fail .hint { display: block; color: #5f6368; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="msg" id="msg">✓ Copied</div>
  <div class="sub" id="sub"></div>
  <textarea id="md" readonly spellcheck="false"></textarea>
  <div class="hint">Press Cmd+C (Mac) or Ctrl+C (Windows) to copy, then close the tab.</div>
  <script>
    (function () {
      // Brief markdown is delivered in the URL HASH (base64, UTF-8) so arbitrarily
      // long briefs aren't constrained by query-string / server URL limits, and the
      // content never leaves the browser (no server / proxy / history logging).
      function decodeHashMarkdown() {
        var h = (window.location.hash || '').replace(/^#/, '');
        if (!h) return '';
        try {
          var bin = atob(h.replace(/-/g, '+').replace(/_/g, '/'));
          var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
          return new TextDecoder('utf-8').decode(bytes);
        } catch (e) { return ''; }
      }

      var params = new URLSearchParams(window.location.search);
      var TITLE = params.get('title') || 'Executive Brief';
      var VALUE = decodeHashMarkdown();
      var done = false;

      async function tryCopy() {
        if (done) return true;
        if (!VALUE) return false;
        // Modern Clipboard API
        try { await navigator.clipboard.writeText(VALUE); return true; }
        catch (e) { /* fall through */ }
        // Legacy execCommand
        try {
          var ta = document.createElement('textarea');
          ta.value = VALUE;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) return true;
        } catch (e) { /* fall through */ }
        return false;
      }

      function finishSuccess() {
        if (done) return;
        done = true;
        // Opened from the Chat button as a top-level tab — close it so the user
        // sees only a ~150ms flash and stays in Chat with the brief on the clipboard.
        window.close();
      }

      function showFallback() {
        if (done) return;
        done = true;
        document.body.classList.add('fail');
        document.getElementById('msg').textContent = TITLE;
        document.getElementById('sub').textContent =
          VALUE ? 'Raw Markdown — copy and paste into your AI assistant.' : 'No brief content found in the link.';
        document.title = TITLE + ' — Copy as Markdown';
        var ta = document.getElementById('md');
        ta.value = VALUE;
        ta.focus();
        ta.select();
      }

      async function attempt() {
        if (done) return;
        if (await tryCopy()) finishSuccess();
      }

      // Same strategy as the lead copy page (index.html): try immediately, then
      // again on every focus / visibility change for up to 2.5s. Tabs opened in
      // the background (cmd-click, middle-click, browser settings) start without
      // focus, and both clipboard APIs require document.hasFocus() === true.
      // Retrying on focus events catches the moment focus arrives; only after all
      // of that fails do we show the manual-copy UI.
      if (!VALUE) { showFallback(); return; }
      attempt();
      window.addEventListener('focus', attempt);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) attempt();
      });
      setTimeout(attempt, 100);
      setTimeout(attempt, 300);
      setTimeout(attempt, 700);
      setTimeout(attempt, 1500);
      // Final timeout — show the manual UI if we still haven't copied.
      setTimeout(function () { if (!done) showFallback(); }, 2500);
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Brief — Copy as Markdown</title>
  <style>
    :root { --vtc-purple:#600C54; --vtc-green:#137333; }
    html, body { margin:0; padding:0; }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:#f6f7f9; color:#202124; padding:24px; line-height:1.5;
    }
    .wrap { max-width:760px; margin:0 auto; }
    h1 { font-size:18px; color:var(--vtc-purple); margin:0 0 4px; }
    .sub { color:#5f6368; font-size:13px; margin:0 0 16px; }
    .bar { display:flex; gap:12px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
    button {
      font:inherit; font-weight:600; font-size:15px; color:#fff; background:var(--vtc-purple);
      border:0; border-radius:8px; padding:11px 18px; cursor:pointer;
    }
    button:hover { filter:brightness(1.08); }
    .status { font-size:14px; font-weight:600; color:var(--vtc-green); opacity:0; transition:opacity .15s; }
    .status.show { opacity:1; }
    textarea {
      width:100%; box-sizing:border-box; min-height:60vh; resize:vertical;
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px;
      padding:14px; border:1px solid #dadce0; border-radius:10px; background:#fff; color:#202124;
      white-space:pre; tab-size:2;
    }
    .hint { color:#5f6368; font-size:12px; margin-top:10px; }
    .err { color:#b3261e; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Executive Brief</h1>
    <p class="sub">Raw Markdown — copy and paste into your AI assistant to discuss or evaluate.</p>
    <div class="bar">
      <button id="copyBtn">📋 Copy as Markdown</button>
      <span class="status" id="status">✓ Copied to clipboard</span>
    </div>
    <textarea id="md" readonly spellcheck="false"></textarea>
    <p class="hint" id="hint">Tip: if the button doesn't copy (browser focus), click in the box, then Cmd+C (Mac) / Ctrl+C (Windows).</p>
  </div>
  <script>
    (function () {
      // Brief markdown is delivered in the URL hash (base64, UTF-8) so arbitrarily
      // long briefs aren't constrained by query-string / server URL limits. The
      // hash never leaves the browser. Optional ?title= sets the heading.
      function decodeHashMarkdown() {
        var h = (window.location.hash || '').replace(/^#/, '');
        if (!h) return '';
        try {
          var bin = atob(h.replace(/-/g, '+').replace(/_/g, '/'));
          var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
          return new TextDecoder('utf-8').decode(bytes);
        } catch (e) { return ''; }
      }

      var params = new URLSearchParams(window.location.search);
      var title = params.get('title');
      if (title) {
        document.getElementById('title').textContent = title;
        document.title = title + ' — Copy as Markdown';
      }

      var MD = decodeHashMarkdown();
      var ta = document.getElementById('md');
      var status = document.getElementById('status');
      var hint = document.getElementById('hint');

      if (!MD) {
        ta.value = '';
        ta.style.minHeight = '80px';
        hint.textContent = 'No brief content found in the link.';
        hint.className = 'hint err';
        document.getElementById('copyBtn').disabled = true;
        return;
      }
      ta.value = MD;

      function flashCopied() { status.classList.add('show'); setTimeout(function(){ status.classList.remove('show'); }, 2200); }

      async function copyMarkdown() {
        try { await navigator.clipboard.writeText(MD); flashCopied(); return true; }
        catch (e) { /* fall through to legacy */ }
        try {
          ta.focus(); ta.select();
          if (document.execCommand('copy')) { flashCopied(); return true; }
        } catch (e) {}
        return false;
      }

      document.getElementById('copyBtn').addEventListener('click', copyMarkdown);
      // Best-effort auto-copy on load (works when the tab has focus from the click).
      copyMarkdown();
    })();
  </script>
</body>
</html>
